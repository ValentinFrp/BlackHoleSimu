[package]
name = "blackhole-simu"
version = "0.1.0"
edition = "2021"
description = "Simulateur de trou noir de Schwarzschild en temps réel (Rust + wgpu + WASM)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
winit = "0.30"
wgpu = "29"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }
web-time = "1"
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["hdr", "png"] }
half = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
] }
wgpu = { version = "29", features = ["webgl"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in"] }
